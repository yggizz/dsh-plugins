# One Host row serves the Client button's routes. No credentials are shipped:
# with `mechanism: auto` and an empty token the Host still restarts the
# container by ending its own process (the container's restart policy brings it
# back). Fill `endpoint` + `accessToken` in Plugins > Restart button > Configure
# to make it issue a real `docker restart` through the UGREEN OpenCLI gateway.
- insert:
    - id: dsh-restart-button
      name: dsh-restart-button
      config:
        mechanism: auto
        endpoint: ''
        accessToken: ''
        containerId: ''
        socketId: ugreen.dockerserv.internal.grpc
        rejectUnauthorized: false
